name: bugbot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: bugbot-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  bugbot:
    # Job-level `if` cannot read the `env` context, so the draft label stays a
    # literal here. `draft_label` below must be the same string: the `if`
    # decides whether a `labeled` event starts a run, and the reusable workflow
    # decides whether a draft is reviewed. If they drift, a run either starts
    # and skips, or never starts at all.
    if: github.event.action != 'labeled' || github.event.label.name == 'bugbot'
    uses: anduraio/bugbot/.github/workflows/review.yml@<bugbot-commit-sha>
    # Pin a full 40-character Bugbot commit SHA above; never a moving tag.
    with:
      pr: ${{ inputs.pr }}
      # Must match the literal in the job-level `if` above.
      draft_label: bugbot
    # Pass secrets explicitly. `inherit` only works inside one organization or
    # enterprise, and this caller is under a different owner.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BUGBOT_APP_ID: ${{ secrets.BUGBOT_APP_ID }}
      BUGBOT_APP_PRIVATE_KEY: ${{ secrets.BUGBOT_APP_PRIVATE_KEY }}
